name: Release

# Started by `npm run release`, which pushes a vX.Y.Z tag. Publishes
# through npm trusted publishing (OIDC): no token, no OTP. npm adds a
# provenance attestation automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@11
      - name: The tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$TAG"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Publish to npm
        run: |
          version="${TAG#v}"
          live="$(npm view "pi-csb-buddy@$version" version 2>/dev/null || true)"
          if [ "$live" = "$version" ]; then
            echo "pi-csb-buddy@$version is already on npm."
          else
            # The steps above already ran prepublishOnly's checks.
            npm publish --ignore-scripts
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog.mjs "${TAG#v}" > notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" \
              --notes-file notes.md --verify-tag
          fi
